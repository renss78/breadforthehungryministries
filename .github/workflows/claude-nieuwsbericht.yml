name: Claude nieuwsbericht

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  claude:
    # Alleen renss78 kan dit starten; de instructies voor Claude staan in CLAUDE.md.
    if: >-
      github.actor == 'renss78' && (
        (github.event_name == 'issues' && github.event.label.name == 'nieuwsbericht') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Foto's en video's uit het issue ophalen
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/download-attachments.mjs
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: nieuwsbericht
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run check),Bash(npm run build)"
